server:
  # Render 등 대부분의 PaaS가 PORT 환경변수로 리스닝 포트를 지정한다.
  port: ${PORT:8080}

spring:
  application:
    name: firewatch-backend
  datasource:
    url: jdbc:h2:file:./data/firewatch;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # Design Ref: §3.1 — schema.sql이 정본, Hibernate가 스키마를 만들지 않는다
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      platform: h2
  h2:
    console:
      enabled: true
      path: /h2-console
  task:
    scheduling:
      # Design Ref: §2.2 — 08:00은 항상 KST 기준(명세서 4.1절 cron: "0 0 8 * * *")
      pool:
        size: 2

firewatch:
  # 로컬 dev(Vite 5173) + 배포 후 Cloudflare Pages 도메인(BE-8/WEB-5에서 추가). Design 문서가 놓쳐 module-7에서 발견.
  allowed-origins: ${FIREWATCH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  scheduler:
    # 매일 08:00 KST(고정 폴백 — 인스턴스가 우연히 떠있을 때만 동작, 실제 트리거는 GitHub Actions).
    # Asia/Seoul 타임존을 SchedulerJob의 @Scheduled에 명시적으로 지정한다.
    cron: "0 0 8 * * *"
    timezone: "Asia/Seoul"
    # 2026-08-23 — 사용자가 설정한 pushTime을 실제로 반영하기 위해 GitHub Actions가 15분마다
    # /api/scheduler/trigger-if-due를 폴링한다. 이 값은 그 폴링 주기보다 커야 놓치는 창이 없다.
    poll-window-minutes: 20
  audit:
    # 이 시간(ms)을 넘긴 "성공" 호출은 AuditLogAspect가 WARNING으로 기록한다 (명세서 5.1절)
    warning-threshold-ms: 3000
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Gemini 3 계열은 세부 버전 무관하게 Google Search Grounding이 무료 티어 일일 0건(2026-08-21
    # 3종 실측 확인, render.yaml 참고). 엔드포인트가 살아있는 3.5로 고정, FALLBACK으로 운영 중.
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    base-url: "https://generativelanguage.googleapis.com/v1beta"
  settings:
    # Design Ref: §7 / ADR 0004 — 쓰기 API 최소 보호(진짜 인증 아님)
    api-key: ${SETTINGS_API_KEY:}
  exim:
    # 한국수출입은행 Open API. 2025-06-25부로 도메인이 oapi.koreaexim.go.kr로 이전됨(실측 확인).
    api-key: ${EXIM_API_KEY:}
    base-url: "https://oapi.koreaexim.go.kr"
  yahoo:
    # 비공식 엔드포인트 — User-Agent 없으면 429(실측 확인, FinancialApiClient 참고)
    base-url: "https://query1.finance.yahoo.com"
  news:
    # 관련 뉴스 RSS. Gemini Search Grounding이 무료 티어에서 막혀(2026-08-21) 대신 도입 — 사용자
    # 요청("클릭하면 실제로 볼 수 있게"). 네이버 검색 API는 NAVER API HUB로 이전되며 신규 신청이
    # 막혔고, Google Custom Search·NCP는 카드 등록 불확실성이 있어 회원가입 자체가 필요 없는
    # RSS로 최종 결정 — [[Decisions/0010-rss-news-instead-of-gemini-grounding]].
    rss-url: ${NEWS_RSS_URL:https://view.asiae.co.kr/rss/stock.htm}
  expo:
    # Expo Push Service — 인증 불필요한 공개 엔드포인트(mobile-app.design.md §2.3)
    push-url: "https://exp.host/--/api/v2/push/send"

logging:
  level:
    com.firewatch.backend: INFO
