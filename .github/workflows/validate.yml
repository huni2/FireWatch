name: Validate code
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: backend
        run: bash gradlew test
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npx tsc --noEmit
