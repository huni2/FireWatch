name: Validate code
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: firewatch_test
          POSTGRES_USER: firewatch_test
          POSTGRES_PASSWORD: firewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firewatch_test -d firewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: backend
        run: bash gradlew test
      - name: PostgreSQL concurrent identity and catalog verification
        working-directory: backend
        env:
          FIREWATCH_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/firewatch_test
        run: bash gradlew test --tests '*SettingsCreationConcurrencyTest' --tests '*CatalogIntegrationTest' --tests '*CommunityIntegrationTest' --rerun-tasks
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npx tsc --noEmit
