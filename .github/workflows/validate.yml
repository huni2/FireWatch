name: Validate code
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: firewatch_test
          POSTGRES_USER: firewatch_test
          POSTGRES_PASSWORD: firewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firewatch_test -d firewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: backend
        run: bash gradlew test
      - name: PostgreSQL concurrent identity and catalog verification
        working-directory: backend
        env:
          FIREWATCH_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/firewatch_test
        run: bash gradlew test --tests '*SettingsCreationConcurrencyTest' --tests '*CatalogIntegrationTest' --tests '*CatalogScaleIntegrationTest' --tests '*CatalogRealScaleIntegrationTest' --tests '*CatalogPageOrderIntegrationTest' --tests '*CommunityIntegrationTest' --tests '*GameRankingIntegrationTest' --tests '*GameSimulationVersionMigrationTest' --tests '*GameTimingIntegrationTest' --rerun-tasks
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failed-tests
          path: |
            backend/build/test-results/test/TEST-*.xml
            backend/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve catalog search measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-search-measurement
          path: backend/build/reports/catalog-search-*.json
          if-no-files-found: warn
      - name: PostgreSQL backup and restore drill
        run: bash scripts/verify-postgres-restore.sh "${{ job.services.postgres.id }}"
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - name: Catalog metadata tests and generated seed consistency
        if: matrix.client == 'web'
        run: |
          node --test ../scripts/build-catalog-seed.test.cjs
          node ../scripts/build-catalog-seed.cjs
          node --test ../scripts/build-krx-directory.test.cjs
          node --test ../scripts/compare-krx-directory.test.cjs
          node ../scripts/build-krx-directory.cjs
          git diff --exit-code -- ../backend/src/main/resources/catalog-seed.json ../backend/src/main/resources/catalog-directory.json
      - name: Isolated game verifier safety tests
        if: matrix.client == 'web'
        run: node --test ../scripts/verify-game-live.test.cjs
      - run: npm run lint
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npx tsc --noEmit
      - if: matrix.client == 'mobile'
        run: node --test scripts/release-check.test.cjs
