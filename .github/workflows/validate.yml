name: Validate code
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL with registry fallback
        id: postgres
        run: bash scripts/start-ci-postgres.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: backend
        run: bash gradlew test
      - name: PostgreSQL concurrent identity and catalog verification
        working-directory: backend
        env:
          FIREWATCH_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/firewatch_test
        run: bash gradlew test --tests '*SettingsCreationConcurrencyTest' --tests '*AccountSessionIntegrationTest' --tests '*PortfolioApiIntegrationTest' --tests '*HoldingNotesIntegrationTest' --tests '*CatalogIntegrationTest' --tests '*CatalogScaleIntegrationTest' --tests '*CatalogRealScaleIntegrationTest' --tests '*CatalogPageOrderIntegrationTest' --tests '*CommunityIntegrationTest' --tests '*GameRankingIntegrationTest' --tests '*GameSimulationVersionMigrationTest' --tests '*GameTimingIntegrationTest' --tests '*BackupReportIntegrationTest' --tests '*GeminiResilienceIntegrationTest' --tests '*RecommendationReportIntegrationTest' --rerun-tasks
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failed-tests
          path: |
            backend/build/test-results/test/TEST-*.xml
            backend/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve catalog search measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-search-measurement
          path: backend/build/reports/catalog-search-*.json
          if-no-files-found: warn
      - name: PostgreSQL backup and restore drill
        run: bash scripts/verify-postgres-restore.sh "${{ steps.postgres.outputs.container_id }}"
      - name: Remove CI PostgreSQL container
        if: always()
        run: docker rm -f firewatch-ci-postgres 2>/dev/null || true
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - name: Catalog metadata tests and generated seed consistency
        if: matrix.client == 'web'
        run: |
          node --test ../scripts/build-catalog-seed.test.cjs
          node ../scripts/build-catalog-seed.cjs
          node --test ../scripts/build-krx-directory.test.cjs
          node --test ../scripts/compare-krx-directory.test.cjs
          node ../scripts/build-krx-directory.cjs
          git diff --exit-code -- ../backend/src/main/resources/catalog-seed.json ../backend/src/main/resources/catalog-directory.json
      - name: Isolated game verifier safety tests
        if: matrix.client == 'web'
        run: node --test ../scripts/verify-game-live.test.cjs
      - name: CI database startup fallback tests
        if: matrix.client == 'web'
        run: node --test ../scripts/start-ci-postgres.test.cjs
      - name: Investment connection and news date contracts
        if: matrix.client == 'web'
        run: node --test ../scripts/design-data-contract.test.cjs
      - name: Holding notes and portfolio checkup contracts
        if: matrix.client == 'web'
        run: node --test ../scripts/holding-notes.test.cjs ../scripts/holding-registration.test.cjs ../scripts/portfolio-checkup.test.cjs
      - name: Investment style self-check rules
        if: matrix.client == 'web'
        run: node --test ../scripts/investment-style.test.cjs
      - name: Encrypted backup safety tests
        if: matrix.client == 'web'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          node --test ../scripts/create-encrypted-backup.test.cjs
          node --test ../scripts/report-backup.test.cjs
      - run: npm run lint
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npx tsc --noEmit
      - if: matrix.client == 'mobile'
        run: node --test scripts/release-check.test.cjs
      - name: Android native login behavior
        if: matrix.client == 'mobile'
        run: node --test scripts/google-sign-in.test.cjs scripts/session-restoration.test.cjs scripts/android-release-size.test.cjs scripts/resource-loading.test.cjs scripts/loading-motion.test.cjs scripts/theme.test.cjs scripts/action-button-colors.test.cjs scripts/market-ux.test.cjs
      - name: Android chart runtime dependency contract
        if: matrix.client == 'mobile'
        run: node --test scripts/native-dependencies.test.cjs
      - name: Android reading sheet interaction contract
        if: matrix.client == 'mobile'
        run: node --test scripts/app-sheet.test.cjs
      - name: Android refresh and numeric input contracts
        if: matrix.client == 'mobile'
        run: node --test scripts/android-polish.test.cjs scripts/news-and-price.test.cjs
      - name: Account record comparison contracts
        if: matrix.client == 'mobile'
        run: node --test scripts/account-record-link.test.cjs
