name: Briefing Scheduler Poll

# Design Ref: ADR "Render + GitHub Actions wake trigger" (2026-08-20), 2026-08-23 갱신 —
# Settings 화면의 "수신 시간"(pushTime)이 실제로는 어디에도 안 읽혀 항상 08:00 KST에만 발송되던
# 문제를 발견해, 고정 1일 1회 트리거 대신 15분마다 폴링하는 방식으로 바꿨다. 실제 실행 여부는
# 백엔드(/api/scheduler/trigger-if-due)가 저장된 pushTime과 현재 시각을 비교해 판정한다
# (firewatch.scheduler.poll-window-minutes, 기본 20분 — 이 폴링 주기보다 넉넉해야 놓치지 않는다).
# Render 무료 티어는 15분 무활동 시 슬립하는데, 이 폴링 자체가 그 슬립을 막아주는 부수효과도 있다.
#
# 2026-08-31 — 정각(:00/:15/:30/:45)에 맞춘 크론은 전 세계 워크플로가 같은 시각에 몰려 GitHub 쪽
# 지연이 특히 심하다는 게 GitHub 공식 문서의 권고사항. 실제로 이 지연이 누적돼 due-window(20분)를
# 통째로 건너뛰어 8/29~31 사흘 연속 스케줄러가 안 돈 걸 확인 — 정각에서 벗어난 오프셋(:07/:22/:37/:52)
# 으로 옮겨 혼잡을 피한다. due-window 미스에 대한 근본 대응은 SchedulerController의 catch-up 로직.
#
# 2026-09-09 — 9/2~9/9 사이 curl exit 28(타임아웃) 실패 7건 중 6건이 정확히 --max-time에서
# 끊겨 있었다 — Render 무료 티어 콜드스타트(JVM+외부 DB 커넥션 초기화)가 180초를 넘는 경우가
# 종종 있다는 뜻. catch-up 로직 덕에 실제 브리핑 생성엔 영향 없었지만 실패 알림 노이즈를 줄이려
# 여유를 280초로 늘림(public repo라 GitHub Actions 무료 무제한, 비용 문제 없음).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {} # 수동 테스트용 — 이것도 due 판정을 거친다. 강제 실행은 /api/scheduler/trigger를 직접 curl.

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/scheduler/trigger-if-due
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.RENDER_BACKEND_URL }}/api/scheduler/trigger-if-due" \
            -H "X-API-Key: ${{ secrets.SETTINGS_API_KEY }}" \
            --max-time 280)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::스케줄러 폴링 실패 (HTTP $status)"
            exit 1
          fi
