# Design Ref: BE-8 — Render Blueprint. Render 대시보드에서 "New > Blueprint"로 이 저장소를 연결하면
# 이 파일 그대로 서비스가 생성된다. sync:false인 값들은 Render 대시보드에서 직접 입력해야 한다
# (진짜 시크릿은 절대 이 파일이나 repo에 커밋하지 않는다).
services:
  - type: web
    name: firewatch-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/settings
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        # 2026-08-21 실측 3종 전부 확인: 3.7-flash→429, 2.5-flash→404(단종 진행중),
        # 3.5-flash→429. "Gemini 3" 계열은 세부 버전(Flash/Flash-Lite) 상관없이 검색
        # 그라운딩 무료 할당량이 0이라 전부 429 — 임의로 빡센 모델을 고른 게 아니라
        # Google 쪽 무료 티어 정책 자체의 문제. 엔드포인트가 살아있는(404 아닌) 3.5로 고정
        # — 나중에 할당량이 풀리면 바로 작동할 가능성이 2.5보다 높음. FALLBACK으로 운영 중.
        value: gemini-3.5-flash
      - key: EXIM_API_KEY
        sync: false
      - key: SETTINGS_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        # `npx web-push generate-vapid-keys`로 생성. 공개돼도 되는 값이지만 web/.env(VITE_VAPID_PUBLIC_KEY)와
        # 반드시 같은 값이어야 한다.
        sync: false
      - key: VAPID_PRIVATE_KEY
        # 위와 짝 — 이건 진짜 비밀(FCM 서비스 계정 JSON과 동급), 재발급 시 기존 구독이 전부 무효화된다.
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        # Postgres(Supabase) 데이터소스로 전환 — 무료 티어에 영구 디스크가 없어 H2 파일 DB가
        # 슬립→재기동마다 초기화되는 걸 실제로 겪음(2026-08-20). ADR 0009.
        value: prod
      - key: SPRING_DATASOURCE_URL
        # 예: jdbc:postgresql://<host>:5432/postgres (Supabase > Project Settings > Database > Session pooler)
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FIREWATCH_ALLOWED_ORIGINS
        # Cloudflare Pages 실제 배포 URL — ADR 0007. "firewatch" 이름이 겹쳐 "-eqp" 접미사가 붙었다.
        value: https://firewatch-eqp.pages.dev
