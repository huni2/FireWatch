# Design Ref: BE-8 — Render Blueprint. Render 대시보드에서 "New > Blueprint"로 이 저장소를 연결하면
# 이 파일 그대로 서비스가 생성된다. sync:false인 값들은 Render 대시보드에서 직접 입력해야 한다
# (진짜 시크릿은 절대 이 파일이나 repo에 커밋하지 않는다).
services:
  - type: web
    name: firewatch-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/settings
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        # Google Search Grounding(우리가 쓰는 기능)이 Gemini 3 계열 무료 티어에서 일일 0건으로
        # 막혀있어(aistudio.google.com/rate-limit 실측 확인, 2026-08-20) Gemini 2.5로 고정.
        # 기본 RPM/RPD 한도는 3.7과 동일(분당 5회/일 20회) — 성능 손해 없음.
        value: gemini-2.5-flash
      - key: EXIM_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SETTINGS_API_KEY
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        # Postgres(Supabase) 데이터소스로 전환 — 무료 티어에 영구 디스크가 없어 H2 파일 DB가
        # 슬립→재기동마다 초기화되는 걸 실제로 겪음(2026-08-20). ADR 0009.
        value: prod
      - key: SPRING_DATASOURCE_URL
        # 예: jdbc:postgresql://<host>:5432/postgres (Supabase > Project Settings > Database > Session pooler)
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FIREWATCH_ALLOWED_ORIGINS
        # Cloudflare Pages 실제 배포 URL — ADR 0007. "firewatch" 이름이 겹쳐 "-eqp" 접미사가 붙었다.
        value: https://firewatch-eqp.pages.dev
