# Design Ref: BE-8 — Render Blueprint. Render 대시보드에서 "New > Blueprint"로 이 저장소를 연결하면
# 이 파일 그대로 서비스가 생성된다. sync:false인 값들은 Render 대시보드에서 직접 입력해야 한다
# (진짜 시크릿은 절대 이 파일이나 repo에 커밋하지 않는다).
services:
  - type: web
    name: firewatch-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/settings
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        # 대시보드상 "Gemini 3" 계열은 검색 그라운딩 도구 자체가 세부 모델(Flash/Flash-Lite 불문) 상관없이
        # 0건으로 묶여 보였으나, 2.5가 대시보드 표시와 달리 실제로는 404였던 전례가 있어(2026-08-21)
        # 대시보드만 믿지 않고 3.5-flash로 실측 재확인 중.
        value: gemini-3.5-flash
      - key: EXIM_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SETTINGS_API_KEY
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        # Postgres(Supabase) 데이터소스로 전환 — 무료 티어에 영구 디스크가 없어 H2 파일 DB가
        # 슬립→재기동마다 초기화되는 걸 실제로 겪음(2026-08-20). ADR 0009.
        value: prod
      - key: SPRING_DATASOURCE_URL
        # 예: jdbc:postgresql://<host>:5432/postgres (Supabase > Project Settings > Database > Session pooler)
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FIREWATCH_ALLOWED_ORIGINS
        # Cloudflare Pages 실제 배포 URL — ADR 0007. "firewatch" 이름이 겹쳐 "-eqp" 접미사가 붙었다.
        value: https://firewatch-eqp.pages.dev
